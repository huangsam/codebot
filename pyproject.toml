[project]
name = "codebot"
version = "0.1.0"
description = "A code review agent"
dependencies = [
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
    "pylint>=3.0.0",
    "openai>=1.0.0",
]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
